# Deploy/CI parity. Local development on macOS can instead use the Homebrew
# Postgres + pgvector and Redis already installed — see README.

# Inside the network, Postgres and Redis answer to their service names, not
# localhost. .env carries the host-side URLs (localhost) so the same file works
# when the API is run natively, so the container-side URLs are set here and
# override it — `environment` wins over `env_file`.
x-service-urls: &service-urls
  DATABASE_URL: postgresql+psycopg://smartaware:smartaware@db:5432/smartaware
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: smartaware
      POSTGRES_PASSWORD: smartaware
      POSTGRES_DB: smartaware
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartaware"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: .
    command: uv run fastapi run app/main.py --host 0.0.0.0 --port 8000
    env_file: [.env]
    environment: *service-urls
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}

  worker:
    build: .
    command: uv run celery -A app.worker.celery_app worker --loglevel=info
    env_file: [.env]
    environment: *service-urls
    depends_on: [db, redis]

  beat:
    build: .
    command: uv run celery -A app.worker.celery_app beat --loglevel=info
    env_file: [.env]
    environment: *service-urls
    depends_on: [db, redis]

volumes:
  pgdata:
