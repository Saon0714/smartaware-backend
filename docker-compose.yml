# Deploy/CI parity. Local development on macOS can instead use the Homebrew
# Postgres 16 + pgvector and Redis already installed — see README.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: smartaware
      POSTGRES_PASSWORD: smartaware
      POSTGRES_DB: smartaware
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartaware"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: .
    command: uv run fastapi run app/main.py --host 0.0.0.0 --port 8000
    env_file: [.env]
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}

  worker:
    build: .
    command: uv run celery -A app.worker.celery_app worker --loglevel=info
    env_file: [.env]
    depends_on: [db, redis]

  beat:
    build: .
    command: uv run celery -A app.worker.celery_app beat --loglevel=info
    env_file: [.env]
    depends_on: [db, redis]

volumes:
  pgdata:
